<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITEM</title>
    <!--<link href="assets/images/favicon.ico" rel="shortcut icon">-->
    <!-- 탭창 파비콘 들어가야함-->
    <link rel="stylesheet" href="/assets/styles/common.css">
    <link rel="stylesheet" href="/assets/styles/item/index.css">
    <link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,100..900;1,100..900&family=Gowun+Dodum&family=Nanum+Brush+Script&family=Yellowtail&display=swap"
          rel="stylesheet">
    <link href="/assets/images/login/favicon.png" rel="icon">
    <script defer src="/assets/scripts/common.js"></script>
    <script defer src="/assets/scripts/item/item.js"></script>
</head>
<body>
<th:block th:replace="~{/fragments/common.html :: customer-header}">
</th:block>
<main id="main" >
    <img src="../assets/images/my/waviness.png" th:src="${shopInfo.backgroundImage}" class="image" alt="메인이미지">
</main>

<!--상품이미지-->
<div class="background"></div>
<div class="container">
    <div class="splash">
        <div class="image-wrapper">
            <th:block th:each="img, iterStat : ${item.images}">
                <img class="image"
                     th:src="@{/images/{path}(path=${img.imagePath})}"
                     alt="상품이미지"
                     th:id="'splash' + ${iterStat.index}">
            </th:block>

            <img th:if="${#lists.isEmpty(item.images)}"
                 class="image" src="/assets/images/default.png" alt="기본이미지">
        </div>

        <div class="dot-container">
            <th:block th:each="img, iterStat : ${item.images}">
                <a class="dot" th:href="'#splash' + ${iterStat.index}"></a>
            </th:block>
        </div>

        <div class="subImage">
            <th:block th:each="img : ${item.images}">
                <a class="sub" href="#">
                    <img th:src="@{/images/{path}(path=${img.imagePath})}"
                         alt="썸네일" class="sub1">
                </a>
            </th:block>
        </div>
    </div>
    <!--상품가격 및 구매-->
    <div id="buying-wrapper">

        <div class="product">
            <p class="buyText">상품이름</p>
            <span class="productName" th:text="${item.itemName}" >Polyteru X LOTTE GIANTS Retro Uniform Black</span>
            <span class="detail-category" th:text="${item.detailCategory}"></span>
            <p class="buyText">색상</p>
            <p class="koreanProductName" th:text="${item.color}">폴리테루 X 롯데자이언츠 레트로 유니폼 블랙</p>
            <div class="buy">
                <span class="buyText" >판매가격</span>
                <span class="buyNumber"  th:text="${item.price} + ' ' +원"><b>139,000원</b></span>
            </div>
            <p class="star">★</p>
            <a href="#"><p class="score"><b>4.9</b></p></a>
            <a class="reviewButton" href="#">
                <span class="review">리뷰 253</span>
            </a>
        </div>
        <a class="optionLink" href="#">
            <div class="option">
                <div class="selectOption"><b>옵션 선택</b></div>
                <span class="underIcon">▼</span>
            </div>
        </a>
            <div class="buying">구매하기</div>
        <a class="reservation" th:href="@{/reservation/(shopId=${item.shopId})}">예약하기</a>
        <div class="cart_Add">
            <span class="cart">장바구니담기</span>
            <span class="add">관심상품저장</span>
        </div>

<!--        <div class="additional">
            <p>추가 혜택</p>
            <a href="#">더보기</a>
        </div>

        <div class="point">
            <p class="pointCredit">포인트</p>
            <p class="credit">계좌 간편결제 시 1% 적립</p>
        </div>
        <div class="point">
            <p class="pointCredit">결제</p>
            <p class="credit">크림카드 최대 15만... 외 10건</p>
        </div>-->

        <div class="delivery">
            <p class="deliveryInformation">배송 정보</p>
            <div class="deliveryImage">
                <img src="../assets/images/item/delivery.png" alt="deliveryIcon">
                <div class="deliveryContainer">
                    <p class="deliveryText1"><b>브랜드배송</b> 3,000원</p>
                    <p class="deliveryText2">입점한 브랜드에서 직접 택배 배송</p>
                    <p class="deliveryText3">7만원 이상 구매 시 배송비 무료</p>
                </div>
            </div>

            <div class="shopName">
                <a th:href="@{/shop/(shopId=${item.shopId})}">
                    <img class="shopImage" src="../assets/images/item/store.webp" alt="" th:src="${shopInfo.profileImage}">
                    <p th:text="${shopInfo.shopName}">Polyteru</p>
                    <p class="polyteru"> ></p>
                    <div class="attractive">
                        <p th:text="${shopInfo.shopName}" >폴리테루 </p>
                        <p> º 관심</p>
                        <p>2.1만</p>
                    </div>
                </a>
                <div class="save">
                    <input type="checkbox" id="bookmark-toggle" hidden>
                    <label for="bookmark-toggle" class="bookmark-label">
                        <img src="../assets/images/item/save1.png" class="bookmark default" alt="bookmark">
                        <img src="../assets/images/item/save2.png" class="bookmark active" alt="bookmark-black">
                    </label>
                </div>
            </div>
        </div>
        <!--광고 배너-->
        <div class="ad">
            <img src="../assets/images/item/ad.png" alt="ad" class="ad">
        </div>

        <!--리뷰-->
<!--        <div class="review">
            <h3>리뷰 ★ 4.9 (276)</h3>
            <div class="review-bar">
                5<div class="bar"><span style="width:90%"></span></div>
                4<div class="bar"><span style="width:5%"></span></div>
                3<div class="bar"><span style="width:3%"></span></div>
                2<div class="bar"><span style="width:1%"></span></div>
                1<div class="bar"><span style="width:0"></span></div>
            </div>
            <ul>
                <li>정사이즈예요 — 61%</li>
                <li>두께감이 좋아요 — 69%</li>
                <li>퀄리티가 만족스러워요 — 53%</li>
            </ul>
            <div class="moreReview">리뷰 더보기</div>
        </div>
    </div>-->
</div>
<!--<div class="productContainer">
    <ul class="productHead">
        <li class="item"><a href="#">상품 상세정보</a></li>
        <li class="item"><a href="#">교환 및 반품 안내</a></li>
        <li class="item"><a href="#">스타일 리뷰14</a></li>
        <li class="item"><a href="#">추천 상품</a></li>
    </ul>
</div>-->
</div>
<!-- 옵션 선택 모달 -->
<input type="hidden" id="serverSizeData" th:value="${item.size}" />
<div class="modal" id="optionModal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2>사이즈 선택</h2>

        <div class="size-options" id="sizeGrid">
        </div>

        <button class="confirm-size-button" id="confirmSizeButton">선택 완료</button>
    </div>
</div>

</body>
</html>
