<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MyPage</title>
    <link rel="stylesheet" href="/assets/styles/my/index.css">
    <link rel="stylesheet" href="/assets/styles/my/common.css">
    <link rel="stylesheet" href="/assets/styles/common.css">
    <link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,100..900;1,100..900&family=Gowun+Dodum&family=Nanum+Brush+Script&display=swap" rel="stylesheet">
    <link href="/assets/images/login/favicon.png" rel="icon">
    <script defer src="/assets/scripts/common.js"></script>
    <script defer src="/assets/scripts/my/my.js"></script>
    <script>

    </script>
</head>
<body>
<!-- 헤더부분 , 로고와 네비바가 들어감 -->
<th:block th:replace="~{/fragments/common.html :: customer-header}">
</th:block>
<main id="main">
    <img src="../assets/images/my/my-back2.jpg" class="image" alt="">
</main>

<div id="MY" class="box">

    <div id="category">
        <div class="container">
            <label class="my" onclick="loadTab('home', this)">마이페이지</label>

            <nav class="nav">
                <div class="list">
                    <strong class="title">쇼핑정보</strong>
                    <ul class="menu">
                        <li class="item" onclick="loadTab('orders', this)" data-tab="orders">구매 내역</li>
                        <li class="item" onclick="loadTab('reservation', this)" data-tab="reservation" >예약 및 픽업상품</li>
                        <li class="item" onclick="loadTab('likes-shop', this)" data-tab="likes-shop">관심 매장</li>
                        <li class="item" onclick="loadTab('likes-item', this)" data-tab="likes-item">관심 상품</li>
                    </ul>
                </div>
                <div class="list">
                    <strong class="title">내 정보</strong>
                    <ul class="menu">
                        <li class="item" onclick="loadTab('profile', this)" data-tab="profile">프로필 관리</li>
                        <li class="item" onclick="loadTab('address', this)" data-tab="address">배송지 관리</li>
                        <!--<li class="item" onclick="loadTab('custom', this)" data-tab="custom">나의 맞춤 정보</li>-->
                    </ul>
                </div>
            </nav>
        </div>
    </div>

    <div id="dynamic-content">
        <div th:replace="~{fragments/myfragments.html :: home}"></div>
    </div>

</div>

</body>
</html>
