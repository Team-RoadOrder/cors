<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" type="text/css" href="/assets/styles/resetpw/style.css">
    <link rel="stylesheet" type="text/css" href="/assets/styles/common.css">
    <link href="/assets/images/login/favicon.png" rel="icon" >
    <script defer src="/assets/scripts/common.js"></script>
    <script defer src="/assets/scripts/resetpw/resetpw.js"></script>
    <title>ResetPW</title>
    <style>

    </style>
</head>
<body>

<section class="login-form" >
    <a href="/login" class="box" id="logo">
        <img class="site-logo" src="/assets/images/main/img.png" alt="logo">
    </a>
    <form id="loginForm" autocomplete="off">
        <div class="int-area">
            <input type="email" id="email" name="email" required placeholder="" minlength="5" maxlength="50">
            <label for="email">이메일</label>
            <input hidden name="salt" type="hidden">
            <button type="button" name="emailSendButton">인증하기</button>
        </div>
        <div class="int-area">
            <input type="text" id="code" name="code" required placeholder="" minlength="6" maxlength="6" disabled>
            <label for="code">이메일 인증번호</label>
            <button type="button" name="verifyButton" disabled>확인하기</button>
        </div>

        <div class="int-area">
            <input type="password" id="password" name="password" placeholder="" required minlength="6" maxlength="20"> <label for="password">비밀번호 (6자 이상)</label>
        </div>

        <div class="int-area">
            <input type="password" id="confirm" name="confirm" maxlength="20" minlength="6" required placeholder="">
            <label for="confirm">비밀번호 확인</label>
        </div>
        <div class="btn-area">
            <button type="submit" id="btn">비밀번호재설정</button>
        </div>
    </form>
    <div class="container">
    <span class="caption">
        <a href="/login">로그인</a>
    </span>
    <span class="caption">
        <a href="/register"> 회원가입 </a>
    </span>
    </div>
</section>


</body>
</html>
</body>
</html>
