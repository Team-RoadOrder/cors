<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>판매자 매출 흐름</title>
    <link href="/assets/images/login/favicon.png" rel="icon" >
    <link rel="stylesheet" type="text/css" href="/assets/styles/common.css">
    <link rel="stylesheet" href="/assets/styles/ownergraph/common.css">
    <link rel="stylesheet" href="/assets/styles/ownergraph/index.css">
    <script defer src="/assets/scripts/ownermain/toggle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script defer src="/assets/scripts/common.js"></script>
    <script defer src="/assets/scripts/ownergraph/ownergraph.js"></script>
</head>
<body>

<th:block th:replace="~{/fragments/common.html :: owner-header}"></th:block>
<main id="main">
    <button id="toggleNav" class="toggle-btn">
        <img src="/assets/images/ownershop/arrow-left.png" alt="닫기" class="toggle-icon"/>
    </button>
    <nav id="nav" class="open">
        <div class="info">매장관리 페이지</div>
        <div class="profile">
            <img th:src="${shop.profileImage != null ? shop.profileImage : '/assets/images/ownermain/brand.jpeg'}"
                 alt="" class="profile-img" id="profileImg" style="cursor: pointer;">
            <div class="message">클릭시 변경 가능합니다.</div>

            <div class="title">
                <input type="text" id="shopTitle" th:value="${shop.shopName}" readonly>
            </div>
        </div>
        <ul class="nav-list">
            <li class="dashboard">
                <a href="/owner">대시보드</a>
            </li>
            <li class="register-form">
                <a href="/owner/shop">상품등록</a>
            </li>
            <li class="register-owner-form">
                <a href="/owner/member">관리자권한부여</a>
            </li>
            <li class="graph-form">
                <a href="/owner/graph">매출흐름</a>
            </li>
        </ul>
    </nav>
    <div class="sections">
        <div class="admin-header">
            <h1 class="admin-title">판매·매출 현황</h1>
        </div>

        <div class="dashboard-layout">
            <div class="top-section">
                <div class="graph-container">
                    <div class="graph-header">
                        <h2 class="title">매출추이</h2>
                        <div class="buttons">
                            <button type="button" class="weekButton -selected" onclick="SalesChartModule.loadGraph('daily')">주간</button>
                            <button type="button" class="monthButton" onclick="SalesChartModule.loadGraph('monthly')">월간</button>
                        </div>
                    </div>
                    <div class="chart-area">
                        <canvas id="salesChart"></canvas>
                    </div>
                </div>

                <div class="status-container">
                    <div class="weekStatus">
                        <h2 class="title">금주 현황</h2>
                        <div class="status-items">
                            <div class="status-card">
                                <div class="label">금주 매출</div>
                                <div class="value-row">
                                    <span class="value" th:text="${#numbers.formatInteger(status.currentSales, 0, 'COMMA') + '원'}">0원</span>
                                    <span class="change up" th:text="${'▲ ' + status.salesChangePercent + '%'}">0%</span>
                                </div>
                            </div>
                            <div class="status-card">
                                <div class="label">금주 주문수</div>
                                <div class="value-row">
                                    <span class="value" th:text="${status.currentOrderCount + '건'}">0건</span>
                                    <span class="change down" th:text="${'▼ ' + status.orderCountChangePercent + '%'}">0%</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="weekList">
                        <h2 class="title">금주 결제 리스트</h2>
                        <div class="table-wrapper">
                            <table>
                                <thead>
                                <tr><th>고객명</th><th>제품명</th><th>상태</th><th>일자</th></tr>
                                </thead>
                                <tbody>
                                <tr th:each="payment : ${payments}">
                                    <td th:text="${payment.customerName}">홍길동</td>
                                    <td th:text="${payment.productName}">상품명</td>
                                    <td><span class="badge complete">결제완료</span></td>
                                    <td th:text="${#temporals.format(payment.orderDate, 'yyyy-MM-dd')}">2026-01-15</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bottom-section">
                <h2 class="bottom-title">매출 상위 제품</h2>
                <div class="product-grid">
                    <th:block th:each="i : ${#numbers.sequence(0, 4)}">

                        <div class="product-card" th:if="${topProducts.size() > i}" th:with="product=${topProducts[i]}">
                            <div class="rank-badge" th:text="${product.rank}">1</div>
                            <div class="img-box">
                                <img th:src="${product.imagePath != null ? '/images/' + product.imagePath : '/assets/images/ownergraph/no_image.png'}" alt="제품">
                            </div>
                            <div class="info-box">
                                <p class="p-name" th:text="${product.productName}">제품명</p>
                                <p class="p-price" th:text="${#numbers.formatInteger(product.totalSales, 0, 'COMMA') + '원'}">0원</p>
                            </div>
                        </div>

                        <div class="product-card empty" th:unless="${topProducts.size() > i}">
                            <div class="rank-badge" th:text="${i + 1}">1</div>
                            <div class="img-box">
                                <img src="/assets/images/ownergraph/no_image.png" alt="등록된 상품 없음">
                            </div>
                            <div class="info-box">
                                <p class="p-name">상품 정보를 기다리고 있습니다</p>
                                <p class="p-price">0원</p>
                            </div>
                        </div>
                    </th:block>
                </div>
            </div>
        </div>
    </div>
</main>
<th:block th:replace="~{/fragments/owner.html :: owner-bottom-nav}"></th:block>
</body>
</html>
