<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결제 실패</title>
    <link rel="stylesheet" th:href="@{/assets/styles/common.css}">
    <link rel="stylesheet" th:href="@{/assets/styles/payment/result.css}">
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
</head>
<body>
<div class="container">
    <div class="icon-wrapper fail-icon">✖</div>
    <div class="message">결제에 실패하였습니다.</div>
    <div class="details">
        <p>사유: <span th:text="${message}"></span></p>
        <p th:if="${code}">에러코드: <span th:text="${code}"></span></p>
    </div>
    <a href="javascript:history.back()" class="btn-action">이전 페이지로</a>
</div>
</body>
</html>
