<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>주문 결제</title>
    <script src="https://js.tosspayments.com/v2/standard"></script>
    <link href="/assets/styles/common.css" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,100..900;1,100..900&family=Gowun+Dodum&family=Nanum+Brush+Script&display=swap" rel="stylesheet">
    <link href="/assets/styles/payment/pay.css" rel="stylesheet" type="text/css">
    <link href="/assets/styles/payment/common.css" rel="stylesheet" type="text/css">
    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <script defer src="/assets/scripts/common.js" type="text/javascript"></script>
    <script defer src="/assets/scripts/payment/payment.js" type="text/javascript"></script>
</head>
<body>
<th:block th:replace="~{/fragments/common.html :: customer-header}"></th:block>
<th:block th:replace="~{/fragments/common.html :: customer-mobile-header}"></th:block>
<th:block th:replace="~{/fragments/common.html :: customer-mobile-footer}"></th:block>

<!-- 주소 검색 모달 (복구) -->
<div id="dialog" class="dialog-overlay">
    <a class="close dialog-close" href="#">
        <img alt="X" class="image dialog-close-img" src="/assets/images/register/close.png">
    </a>
    <div class="modal dialog-modal"></div>
</div>

<!-- 결제 완료 화면 (초기에는 숨김) -->
<div id="paymentCompleteModal" class="payment-complete-modal">
    <!-- 스텝 인디케이터 추가 (타이틀 제거) -->
    <div class="page-header payment-complete-header">
        <!-- 타이틀 제거됨 -->
        <div class="steps">
            <span class="step">1</span>
            <span class="step">2</span>
            <span class="step active">3</span>
        </div>
    </div>

    <div class="payment-complete-content">
        <h2 class="payment-complete-title">결제 완료</h2>
        <p class="payment-complete-desc">주문이 성공적으로 완료되었습니다.</p>
        <button type="button" id="btnGoToOrders" class="btn-go-to-orders">
            주문내역으로 가기
        </button>
    </div>
</div>

<main id="main">
    <div class="container" id="paymentContainer">
        <div class="page-header">
            <h1>주문 결제</h1>
            <div class="steps">
                <span class="step">1</span>
                <span class="step active">2</span>
                <span class="step">3</span>
            </div>
        </div>

        <div class="checkout-layout">

            <!-- 왼쪽 섹션 -->
            <div class="left-section">

                <!-- 1. 주문 고객 -->
                <section class="checkout-box">
                    <h3>주문 고객</h3>
                    <div class="box-content">
                        <div class="row">
                            <label for="orderer_name" class="label">이름</label>
                            <input type="text" class="input-field" id="orderer_name" placeholder="이름을 입력하세요" th:value="${user != null ? user.name : ''}">
                        </div>
                        <div class="row">
                            <span class="label">연락처</span>
                            <div class="phone-group" th:with="cleanPhone=${user != null && user.phone != null ? #strings.replace(user.phone, '-', '') : ''}">
                                <label for="orderer_phone_1" class="hidden-label">연락처 앞자리</label>
                                <input type="text" class="input-field phone-part" id="orderer_phone_1" maxlength="3" th:value="${cleanPhone.length() >= 3 ? #strings.substring(cleanPhone, 0, 3) : cleanPhone}">
                                <span class="dash">-</span>
                                <label for="orderer_phone_2" class="hidden-label">연락처 중간자리</label>
                                <input type="text" class="input-field phone-part" id="orderer_phone_2" maxlength="4" th:value="${cleanPhone.length() >= 7 ? #strings.substring(cleanPhone, 3, 7) : ''}">
                                <span class="dash">-</span>
                                <label for="orderer_phone_3" class="hidden-label">연락처 뒷자리</label>
                                <input type="text" class="input-field phone-part" id="orderer_phone_3" maxlength="4" th:value="${cleanPhone.length() > 7 ? #strings.substring(cleanPhone, 7) : ''}">
                            </div>
                        </div>
                        <div class="row">
                            <span class="label">이메일</span>
                            <div class="email-group" th:with="emailArr=${user != null && user.email != null ? #strings.arraySplit(user.email, '@') : null}">
                                <label for="email_id" class="hidden-label">이메일 아이디</label>
                                <input type="text" class="input-field email-part" id="email_id" placeholder="이메일" th:value="${emailArr != null && emailArr.length > 0 ? emailArr[0] : ''}">
                                <span class="at">@</span>
                                <label for="email_domain" class="hidden-label">이메일 도메인</label>
                                <input type="text" class="input-field email-part" id="email_domain" th:value="${emailArr != null && emailArr.length > 1 ? emailArr[1] : ''}">
                                <label for="email_select" class="hidden-label">이메일 도메인 선택</label>
                                <select class="input-field email-select" id="email_select">
                                    <option value="direct">직접 입력</option>
                                    <option value="gmail.com">gmail.com</option>
                                    <option value="naver.com">naver.com</option>
                                    <option value="daum.net">daum.net</option>
                                    <option value="hanmail.net">hanmail.net</option>
                                </select>
                            </div>
                        </div>
                        <!-- 주문자 주소 정보 hidden으로 추가 -->
                        <input type="hidden" id="orderer_address" th:value="${user != null ? user.address : ''}">
                        <input type="hidden" id="orderer_address_detail" th:value="${user != null ? user.addressDetail : ''}">
                    </div>
                </section>

                <!-- 2. 배송지 정보 -->
                <section class="checkout-box">
                    <div class="box-header">
                        <h3>배송지 정보</h3>
                        <button type="button" class="btn-change-address" id="btn-same-as-orderer">구매자와 동일</button>
                    </div>
                    <div class="box-content">
                        <div class="row">
                            <label for="receiver_name" class="label">받는 분</label>
                            <input type="text" class="input-field" id="receiver_name" placeholder="받는 분 성함">
                        </div>
                        <div class="row">
                            <span class="label">연락처</span>
                            <div class="phone-group" id="receiver_phone_group">
                                <label for="receiver_phone_1" class="hidden-label">받는분 연락처 앞자리</label>
                                <input type="text" class="input-field phone-part" id="receiver_phone_1" maxlength="3">
                                <span class="dash">-</span>
                                <label for="receiver_phone_2" class="hidden-label">받는분 연락처 중간자리</label>
                                <input type="text" class="input-field phone-part" id="receiver_phone_2" maxlength="4">
                                <span class="dash">-</span>
                                <label for="receiver_phone_3" class="hidden-label">받는분 연락처 뒷자리</label>
                                <input type="text" class="input-field phone-part" id="receiver_phone_3" maxlength="4">
                            </div>
                        </div>
                        <div class="row" style="align-items: flex-start;">
                            <span class="label" style="margin-top: 10px;">주소</span>
                            <div class="address-group">
                                <div class="input-group address-input-group">
                                    <label for="address_input" class="hidden-label">주소</label>
                                    <input type="text" class="input-field address-input-readonly" id="address_input" placeholder="기본 주소" readonly>
                                    <button type="button" class="btn-change-address btn-search-address-inline" id="btn-search-address">주소 찾기</button>
                                </div>
                                <label for="address_detail_input" class="hidden-label">상세 주소</label>
                                <input type="text" class="input-field" id="address_detail_input" placeholder="상세 주소를 입력하세요">
                            </div>
                        </div>
                    </div>
                </section>

                <!-- 3. 배송 요청사항 -->
                <section class="checkout-box">
                    <h3>배송 요청사항</h3>
                    <div class="box-content">
                        <label for="request_select" class="hidden-label">배송 요청사항 선택</label>
                        <select class="select-request" name="request" id="request_select">
                            <option value="please">배송 시 요청사항을 선택해주세요</option>
                            <option value="문 앞에 놓아주세요">문 앞에 놓아주세요</option>
                            <option value="경비실에 맡겨 주세요">경비실에 맡겨 주세요</option>
                            <option value="파손 위험 상품입니다. 배송시 주의해주세요">파손 위험 상품입니다. 배송시 주의해주세요</option>
                            <option value="direct">직접 입력</option>
                        </select>
                        <label for="request_input" class="hidden-label">배송 요청사항 직접 입력</label>
                        <input type="text" class="input-request" id="request_input" placeholder="요청사항을 입력해주세요">
                    </div>
                </section>

                <!-- 4. 쿠폰 / 포인트 -->
                <section class="checkout-box">
                    <h3>포인트</h3>
                    <div class="box-content">
                        <div class="point-area">
                            <h4 class="point-title">포인트</h4>
                            <div class="input-group">
                                <label for="point-input" class="hidden-label">포인트 입력</label>
                                <input type="number" id="point-input" placeholder="0" min="0" th:max="${user.point}">
                                <button type="button" id="btn-use-all-points">전액 사용</button>
                            </div>
                            <p class="info-text">보유 포인트: <strong id="user-point" th:text="${#numbers.formatInteger(user.point, 0, 'COMMA')} + 'P'">0P</strong></p>
                            <input type="hidden" id="max-point" th:value="${user.point}">
                        </div>
                    </div>
                </section>

                <!-- 5. 결제 수단 (제거됨) -->
                <div style="display:none;">
                    <input type="radio" name="paymentMethodGroup" value="simple" checked>
                    <input type="radio" name="generalPaymentMethod" value="CARD" checked>
                </div>

            </div>

            <!-- 오른쪽 섹션 -->
            <div class="right-section">
                <div class="sticky-summary">

                    <!-- 주문 정보 (상품 목록) -->
                    <section class="summary-box">
                        <h3>주문 정보</h3>
                        <div class="order-items-list">
                            <div class="order-item" th:each="item : ${items}" th:data-cart-id="${item.cartId}" th:data-item-id="${item.itemId}">
                                <div class="item-main">
                                    <div class="item-image">
                                        <img th:if="${item.imagePath != null}" th:src="@{/images/{path}(path=${item.imagePath})}" alt="상품 이미지">
                                    </div>
                                    <div class="item-detail">
                                        <p class="item-name" th:text="${item.itemName}">상품명</p>
                                        <div class="item-option-row-inner">
                                            <span th:text="${item.color}" class="item-option-text">색상</span>
                                            <span class="item-option-text">/</span>
                                            <label>
                                                <select class="item-size-select">
                                                    <option th:each="s : ${item.availableSizes}" th:value="${s}" th:text="${s}" th:selected="${s == item.size}"></option>
                                                </select>
                                            </label>
                                        </div>
                                        <div class="item-price-qty-inner">
                                            <div class="qty-control-inner">
                                                <button type="button" class="btn-qty-minus btn-qty-control">-</button>
                                                <label>
                                                    <input type="text" class="item-qty-input item-qty-input-inner" th:value="${item.quantity}" readonly>
                                                </label>
                                                <button type="button" class="btn-qty-plus btn-qty-control">+</button>
                                            </div>
                                            <span class="price" th:data-unit-price="${item.price}" th:text="${item.price * item.quantity} + '원'">10,000원</span>
                                        </div>
                                    </div>
                                    <!-- + 버튼 추가 -->
                                    <button type="button" class="btn-add-item">+</button>
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- 최종 결제 금액 -->
                    <section class="summary-box price-summary">
                        <h3>최종 결제 금액</h3>
                        <div class="price-row">
                            <span>상품 금액</span>
                            <span id="summary-product-price" th:text="${totalProductPrice} + '원'">10,000원</span>
                        </div>
                        <div class="price-row">
                            <span>배송비</span>
                            <span id="summary-delivery-fee" th:text="${deliveryFee} + '원'">3,000원</span>
                        </div>
                        <div class="price-row">
                            <span>할인/포인트</span>
                            <span id="summary-discount-price">- 0원</span>
                        </div>
                        <div class="price-row total">
                            <span>총 결제 금액</span>
                            <span class="total-price" id="summary-total-price" th:text="${totalPrice} + '원'">13,000원</span>
                        </div>
                    </section>

                    <!-- 결제 확인 및 동의 -->
                    <section class="summary-box agreement-box">
                        <label class="check-label">
                            <input type="checkbox" id="agreeAll">
                            <span>주문 내용을 확인하였으며, 정보 제공 등에 동의합니다.</span>
                        </label>
                    </section>

                    <!-- 결제 버튼 -->
                    <button type="button" class="btn-payment" id="paymentButton">
                        <span id="btn-payment-text" th:text="${totalPrice} + '원 결제하기'">13,000원 결제하기</span>
                    </button>

                </div>
            </div>

        </div>

        <input type="hidden" id="isCartOrder" th:value="${isCartOrder}">
        <!-- 장바구니 ID 목록을 hidden input으로 추가 (리스트 형태이므로 th:each 사용하거나 JSON 문자열로 변환 필요) -->
        <!-- 여기서는 간단하게 th:each로 여러 개의 hidden input 생성 -->
        <th:block th:if="${cartIds != null}">
            <input type="hidden" name="cartId" th:each="cartId : ${cartIds}" th:value="${cartId}" class="cart-id-hidden">
        </th:block>
    </div>
</main>
</body>
</html>
