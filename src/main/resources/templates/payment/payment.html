<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주문 결제</title>
  <link rel="stylesheet" href="/assets/styles/common.css">
  <link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,100..900;1,100..900&family=Gowun+Dodum&family=Nanum+Brush+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/styles/payment/pay.css">
  <link rel="stylesheet" href="/assets/styles/payment/common.css">
  <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
  <script defer src="/assets/scripts/common.js"></script>
  <script defer src="/assets/scripts/payment/payment.js"></script>
</head>
<body>
<th:block th:replace="~{/fragments/common.html :: customer-header}"></th:block>

<div id="dialog" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9999;">
    <a class="close" href="#" style="position: absolute; top: 20px; right: 20px; z-index: 10000;">
        <img alt="X" class="image" src="/assets/images/register/close.png" style="width: 30px; height: 30px;">
    </a>
    <div class="modal" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 32rem; height: 32.375rem; background: #fff;"></div>
</div>

<!-- 결제 완료 화면 (초기에는 숨김) -->
<div id="paymentCompleteModal" style="display: none; width: 100%; min-height: 60vh; justify-content: center; align-items: center; flex-direction: column;">
    <!-- 스텝 인디케이터 추가 (타이틀 제거) -->
    <div class="page-header" style="margin-bottom: 40px; width: 1200px; margin: 0 auto 40px auto;">
        <!-- 타이틀 제거됨 -->
        <div class="steps">
            <span class="step">1</span>
            <span class="step">2</span>
            <span class="step active">3</span>
        </div>
    </div>

    <div style="padding: 60px; border-radius: 12px; text-align: center; width: 500px;">
        <h2 style="margin-bottom: 20px; font-size: 28px; color: #333; font-weight: bold;">결제 완료</h2>
        <p style="margin-bottom: 40px; color: #666; font-size: 18px;">주문이 성공적으로 완료되었습니다.</p>
        <button type="button" id="btnGoToOrders" style="background: #222; color: #fff; border: none; padding: 15px 30px; border-radius: 8px; font-size: 16px; cursor: pointer; width: 100%; font-weight: bold; transition: background 0.3s;">
            주문내역으로 가기
        </button>
    </div>
</div>

<div class="container" id="paymentContainer">
  <div class="page-header">
    <h1>주문 결제</h1>
    <div class="steps">
        <span class="step">1</span>
        <span class="step active">2</span>
        <span class="step">3</span>
    </div>
  </div>

  <div class="checkout-layout">

    <!-- 왼쪽 섹션 -->
    <div class="left-section">

      <!-- 1. 주문 고객 -->
      <section class="checkout-box">
        <h3>주문 고객</h3>
        <div class="box-content">
          <div class="row">
            <span class="label">이름</span>
            <input type="text" class="input-field" id="orderer_name" placeholder="이름을 입력하세요" th:value="${user != null ? user.name : ''}">
          </div>
          <div class="row">
            <span class="label">연락처</span>
            <div class="phone-group" th:with="cleanPhone=${user != null && user.phone != null ? #strings.replace(user.phone, '-', '') : ''}">
              <input type="text" class="input-field phone-part" id="orderer_phone_1" maxlength="3" th:value="${cleanPhone.length() >= 3 ? #strings.substring(cleanPhone, 0, 3) : cleanPhone}">
              <span class="dash">-</span>
              <input type="text" class="input-field phone-part" id="orderer_phone_2" maxlength="4" th:value="${cleanPhone.length() >= 7 ? #strings.substring(cleanPhone, 3, 7) : ''}">
              <span class="dash">-</span>
              <input type="text" class="input-field phone-part" id="orderer_phone_3" maxlength="4" th:value="${cleanPhone.length() > 7 ? #strings.substring(cleanPhone, 7) : ''}">
            </div>
          </div>
          <div class="row">
            <span class="label">이메일</span>
            <div class="email-group" th:with="emailArr=${user != null && user.email != null ? #strings.arraySplit(user.email, '@') : null}">
              <input type="text" class="input-field email-part" id="email_id" placeholder="이메일" th:value="${emailArr != null && emailArr.length > 0 ? emailArr[0] : ''}">
              <span class="at">@</span>
              <input type="text" class="input-field email-part" id="email_domain" th:value="${emailArr != null && emailArr.length > 1 ? emailArr[1] : ''}">
              <select class="input-field email-select" id="email_select" style="margin-left: 5px; width: 120px;">
                  <option value="direct">직접 입력</option>
                  <option value="gmail.com">gmail.com</option>
                  <option value="naver.com">naver.com</option>
                  <option value="daum.net">daum.net</option>
                  <option value="hanmail.net">hanmail.net</option>
              </select>
            </div>
          </div>
        </div>
      </section>

      <!-- 2. 배송지 정보 -->
      <section class="checkout-box">
        <div class="box-header">
          <h3>배송지 정보</h3>
          <button type="button" class="btn-change-address" id="btn-same-as-orderer">구매자와 동일</button>
        </div>
        <div class="box-content">
          <div class="row">
            <span class="label">받는 분</span>
            <input type="text" class="input-field" id="receiver_name" placeholder="받는 분 성함">
          </div>
          <div class="row">
            <span class="label">연락처</span>
            <div class="phone-group" id="receiver_phone_group">
              <input type="text" class="input-field phone-part" maxlength="3">
              <span class="dash">-</span>
              <input type="text" class="input-field phone-part" maxlength="4">
              <span class="dash">-</span>
              <input type="text" class="input-field phone-part" maxlength="4">
            </div>
          </div>
          <div class="row" style="align-items: flex-start;">
            <span class="label" style="margin-top: 10px;">주소</span>
            <div class="address-group">
              <div class="input-group" style="display: flex; gap: 10px; width: 100%;">
                  <input type="text" class="input-field" id="address_input" placeholder="기본 주소" readonly style="cursor: pointer; flex: 1;">
                  <button type="button" class="btn-change-address" id="btn-search-address" style="white-space: nowrap;">주소 찾기</button>
              </div>
              <input type="text" class="input-field" id="address_detail_input" placeholder="상세 주소를 입력하세요">
            </div>
          </div>
        </div>
      </section>

      <!-- 3. 배송 요청사항 -->
      <section class="checkout-box">
        <h3>배송 요청사항</h3>
        <div class="box-content">
          <select class="select-request" name="request">
            <option value="please">배송 시 요청사항을 선택해주세요</option>
            <option value="문 앞에 놓아주세요">문 앞에 놓아주세요</option>
            <option value="경비실에 맡겨 주세요">경비실에 맡겨 주세요</option>
            <option value="파손 위험 상품입니다. 배송시 주의해주세요">파손 위험 상품입니다. 배송시 주의해주세요</option>
            <option value="direct">직접 입력</option>
          </select>
          <input type="text" class="input-request" placeholder="요청사항을 입력해주세요" style="display: none; margin-top: 10px; width: 100%;">
        </div>
      </section>

      <!-- 4. 쿠폰 / 포인트 -->
      <section class="checkout-box">
        <h3>쿠폰 / 포인트</h3>
        <div class="box-content">
          <div class="coupon-area">
            <h4 style="font-size: 14px; margin-bottom: 8px; color: #555;">쿠폰</h4>
            <div class="input-group">
              <input type="text" placeholder="쿠폰 번호 입력" disabled>
              <button type="button" disabled>적용</button>
            </div>
            <p class="info-text">사용 가능한 쿠폰이 없습니다.</p>
          </div>
          <div class="point-area" style="margin-top: 20px;">
            <h4 style="font-size: 14px; margin-bottom: 8px; color: #555;">포인트</h4>
            <div class="input-group">
              <input type="number" placeholder="0">
              <button type="button">전액 사용</button>
            </div>
            <p class="info-text">보유 포인트: <strong>5,020P</strong></p>
          </div>
        </div>
      </section>

      <!-- 5. 결제 수단 -->
      <section class="checkout-box">
        <h3>결제 수단</h3>
        <div class="box-content">
          <div class="payment-methods">
            <label class="method-item">
              <input type="radio" name="paymentMethod" value="account" checked>
              <span>계좌 간편결제</span>
            </label>
            <label class="method-item">
              <input type="radio" name="paymentMethod" value="card">
              <span>카드 간편결제</span>
            </label>
            <label class="method-item">
              <input type="radio" name="paymentMethod" value="general">
              <span>일반 결제</span>
            </label>
            <label class="method-item">
              <input type="radio" name="paymentMethod" value="general">
              <span>무통장 입금</span>
            </label>
          </div>

          <!-- 계좌 결제 선택 시 상세 옵션 -->
          <div class="payment-detail account-detail">
            <select>
              <option>국민은행 ****45</option>
              <option>신한은행 ****12</option>
            </select>
            <p class="benefit-text">계좌 결제 시 1% 적립 혜택!</p>
          </div>
        </div>
      </section>

    </div>

    <!-- 오른쪽 섹션 -->
    <div class="right-section">
      <div class="sticky-summary">

        <!-- 주문 정보 (상품 목록) -->
        <section class="summary-box">
          <h3>주문 정보</h3>
          <div class="order-items-list">
            <div class="order-item" th:each="item : ${items}" th:data-cart-id="${item.cartId}" th:data-item-id="${item.itemId}">
              <div class="item-main">
                  <div class="item-image">
                      <img th:if="${item.imagePath != null}" th:src="@{/images/{path}(path=${item.imagePath})}" alt="상품 이미지">
                  </div>
                  <div class="item-detail">
                    <p class="item-name" th:text="${item.itemName}">상품명</p>
                    <div class="item-option-row" style="display: flex; align-items: center; gap: 5px; margin-bottom: 5px; height: 30px;">
                        <span th:text="${item.color}" style="display: flex; align-items: center; height: 100%;">색상</span>
                        <span style="display: flex; align-items: center; height: 100%;">/</span>
                        <select class="item-size-select" style="padding: 4px 8px; font-size: 13px; border: 1px solid #ddd; border-radius: 4px; min-width: 60px; height: 28px;">
                            <option th:each="s : ${item.availableSizes}" th:value="${s}" th:text="${s}" th:selected="${s == item.size}"></option>
                        </select>
                    </div>
                    <div class="item-price-qty" style="display: flex; align-items: center; justify-content: space-between;">
                      <div class="qty-control" style="display: flex; align-items: center; border: 1px solid #ddd; border-radius: 4px;">
                          <button type="button" class="btn-qty-minus" style="width: 24px; height: 24px; background: #fff; border: none; cursor: pointer; font-size: 14px; color: #555;">-</button>
                          <input type="text" class="item-qty-input" th:value="${item.quantity}" readonly style="width: 30px; height: 24px; border: none; text-align: center; font-size: 13px; color: #333; outline: none;">
                          <button type="button" class="btn-qty-plus" style="width: 24px; height: 24px; background: #fff; border: none; cursor: pointer; font-size: 14px; color: #555;">+</button>
                      </div>
                      <span class="price" th:data-unit-price="${item.price}" th:text="${item.price * item.quantity} + '원'">10,000원</span>
                    </div>
                  </div>
                  <!-- + 버튼 추가 -->
                  <button type="button" class="btn-add-item" style="margin-left: 10px; width: 24px; height: 24px; background: #333; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center;">+</button>
              </div>
            </div>
          </div>
        </section>

        <!-- 최종 결제 금액 -->
        <section class="summary-box price-summary">
          <h3>최종 결제 금액</h3>
          <div class="price-row">
            <span>상품 금액</span>
            <span id="summary-product-price" th:text="${totalProductPrice} + '원'">10,000원</span>
          </div>
          <div class="price-row">
            <span>배송비</span>
            <span id="summary-delivery-fee" th:text="${deliveryFee} + '원'">3,000원</span>
          </div>
          <div class="price-row">
            <span>할인/포인트</span>
            <span>- 0원</span>
          </div>
          <div class="price-row total">
            <span>총 결제 금액</span>
            <span class="total-price" id="summary-total-price" th:text="${totalPrice} + '원'">13,000원</span>
          </div>
        </section>

        <!-- 결제 확인 및 동의 -->
        <section class="summary-box agreement-box">
          <label class="check-label">
            <input type="checkbox" id="agreeAll">
            <span>주문 내용을 확인하였으며, 정보 제공 등에 동의합니다.</span>
          </label>
        </section>

        <!-- 결제 버튼 -->
        <button type="button" class="btn-payment" id="paymentButton">
          <span id="btn-payment-text" th:text="${totalPrice} + '원 결제하기'">13,000원 결제하기</span>
        </button>

      </div>
    </div>

  </div>

  <input type="hidden" id="isCartOrder" th:value="${isCartOrder}">
  <!-- 장바구니 ID 목록을 hidden input으로 추가 (리스트 형태이므로 th:each 사용하거나 JSON 문자열로 변환 필요) -->
  <!-- 여기서는 간단하게 th:each로 여러 개의 hidden input 생성 -->
  <th:block th:if="${cartIds != null}">
      <input type="hidden" name="cartId" th:each="cartId : ${cartIds}" th:value="${cartId}" class="cart-id-hidden">
  </th:block>
</div>

</body>
</html>
