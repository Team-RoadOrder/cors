<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>recommended shop</title>
    <link rel="stylesheet" href="/assets/styles/recommendedshop/index.css">
    <link href="/assets/images/login/favicon.png" rel="icon"  >
    <link rel="stylesheet" href="/assets/styles/common.css">
    <script defer src="/assets/scripts/common.js"></script>
</head>
<body>
<!-- 헤더부분 , 로고와 네비바가 들어감 -->
<th:block th:replace="~{/fragments/common.html :: customer-header}">
</th:block>
<th:block th:replace="~{/fragments/common.html :: customer-mobile-header}">
</th:block>
<!--스크롤스냅 적용된 가로 슬라이더: 각 img에 id부여하여 앵커이동-->
<!--헤더에 호버하면 나타나는 메뉴 -->

<div class="video-container">
    <video class="video" poster="https://campaign-cdn.pstatic.net/0/campaign/2022/12/save-the-stars/img/img_spot_v8.jpg" autoplay muted loop playsinline>
        <source src="https://campaign-cdn.pstatic.net/0/campaign/2022/12/save-the-stars/video/spot_v2.mp4" type="video/mp4">
    </video>
    <div class="title-area">
        <span class="title">추천 매장</span>
        <span class="description">선호하는 <strong th:text="${userStyle}">미니멀</strong> 스타일에 따른 추천</span>
    </div>
</div>

<div id="inner">
    <div class="item">
        <div class="text-container">
            <span class="title shop">📍  SHOP</span>
            <span class="description">해당카테고리의 인기많은 매장</span>
        </div>
        <ul class="grid">
            <li class="box" th:each="shop : ${recommendedShops}">
                <a th:href="@{'/shop/?shopId=' + ${shop.shopId}}">
                    <img th:src="${shop.profileImage != null && (shop.profileImage.startsWith('http') || shop.profileImage.startsWith('/')) ? shop.profileImage : '/images/' + shop.profileImage}" alt="" class="image">
                </a>
                <div class="info">
                <span class="title" th:text="${shop.shopName}">
                    밥 위에 소복이 쌓인 튀김,텐동집
                </span>
                    <div class="subtitle">
                    <span class="icon" th:text="${shop.shopAddress}">
                        @전국
                    </span>
                        <span class="icon" th:text="'♥ ' + ${shop.likeCount}">
                        &starf;54만+
                    </span>
                    </div>
                </div>
            </li>
        </ul>
    </div>
    <div class="item">
        <div class="text-container">
            <span class="title product">📍 PRODUCT</span>
            <span class="description">해당카테고리의 인기많은 제품</span>
            <ul class="grid">
                <li class="box" th:each="item : ${popularItems}">
                    <a th:href="@{'/item/?id=' + ${item.id}}">
                        <img th:src="${item.imagePath != null && (item.imagePath.startsWith('http') || item.imagePath.startsWith('/')) ? item.imagePath : '/images/' + item.imagePath}" alt="" class="image">
                    </a>
                    <div class="info">
                        <span class="title" th:text="${item.itemName}">
                            밥 위에 소복이 쌓인 튀김,텐동집
                        </span>
                        <div class="subtitle">
                            <span class="icon" th:text="${item.price} + '원'">
                                @전국
                            </span>
                            <span class="icon" th:text="'★ ' + ${#numbers.formatDecimal(item.rating, 1, 1)} + ' (' + ${item.reviewCount} + ')'">
                                &starf;54만+
                            </span>
                        </div>
                    </div>
                </li>
            </ul>
        </div>
    </div>
    <div class="item">
        <div class="text-container">
            <span class="title all">📍 ALL PRODUCT</span>
            <span class="description">해당카테고리의 모든 제품</span>
            <ul class="grid">
                <li class="box" th:each="item : ${allItems}">
                    <a th:href="@{'/item/?id=' + ${item.id}}">
                        <img th:src="${item.imagePath != null && (item.imagePath.startsWith('http') || item.imagePath.startsWith('/')) ? item.imagePath : '/images/' + item.imagePath}" alt="" class="image">
                    </a>
                    <div class="info">
                        <span class="title" th:text="${item.itemName}">
                            밥 위에 소복이 쌓인 튀김,텐동집
                        </span>
                        <div class="subtitle">
                            <span class="icon" th:text="${item.price} + '원'">
                                @전국
                            </span>
                            <span class="icon" th:text="'★ ' + ${#numbers.formatDecimal(item.rating, 1, 1)} + ' (' + ${item.reviewCount} + ')'">
                                &starf;54만+
                            </span>
                        </div>
                    </div>
                </li>
            </ul>
        </div>
    </div>

</div>
</body>
</html>
