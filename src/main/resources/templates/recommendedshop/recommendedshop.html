<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>추천 매장</title>
    <link rel="stylesheet" href="/assets/styles/common.css">
    <link rel="stylesheet" href="/assets/styles/recommendedshop/index.css">
    <link href="/assets/images/login/favicon.png" rel="icon">
    <script defer src="/assets/scripts/common.js"></script>
    <script defer src="/assets/scripts/recommendedshop/recommendedshop.js"></script>
</head>
<body>
<th:block th:replace="~{/fragments/common.html :: customer-header}"></th:block>
<th:block th:replace="~{/fragments/common.html :: customer-mobile-header}"></th:block>
<th:block th:replace="~{/fragments/common.html :: customer-mobile-footer}"></th:block>

<div class="video-container">
    <video class="video" poster="https://campaign-cdn.pstatic.net/0/campaign/2022/12/save-the-stars/img/img_spot_v8.jpg" autoplay muted loop playsinline>
        <source src="https://campaign-cdn.pstatic.net/0/campaign/2022/12/save-the-stars/video/spot_v2.mp4" type="video/mp4">
    </video>
    <div class="title-area">
        <span class="title">추천 매장</span>
        <span class="description">선호하는 <strong th:text="${userStyle}">미니멀</strong> 스타일에 따른 추천</span>
    </div>
</div>

<div id="inner">
    <div class="item">
        <div class="text-container">
            <span class="title shop">SHOP</span>
            <span class="description">해당 카테고리의 인기 많은 매장</span>
        </div>
        <div class="slider-container">
            <button class="slider-nav prev" type="button">&lt;</button>
            <ul class="grid">
                <!-- [수정] 매장이 없을 경우 메시지 표시 -->
                <li class="box empty-message" th:if="${recommendedShops == null || #arrays.isEmpty(recommendedShops)}">
                    <div class="info">
                        <span class="nonTitle">추천할 매장이 없습니다.</span>
                    </div>
                </li>
                <li class="box" th:each="shop : ${recommendedShops}" th:unless="${recommendedShops == null || #arrays.isEmpty(recommendedShops)}">
                    <a th:href="@{'/shop/?shopId=' + ${shop.shopId}}">
                        <!-- 매장 이미지 경로 수정 -->
                        <img th:src="${shop.profileImage != null && (shop.profileImage.startsWith('http') || shop.profileImage.startsWith('/')) ? shop.profileImage : '/images/' + shop.profileImage}" alt="매장 이미지" class="image">
                    </a>
                    <div class="info">
                        <span class="title" th:text="${shop.shopName}">매장명</span>
                        <div class="subtitle">
                            <span class="icon" th:text="${shop.shopAddress}">주소</span>
                            <span class="icon" th:text="'♥ ' + ${shop.likeCount}">좋아요</span>
                        </div>
                    </div>
                </li>
            </ul>
            <button class="slider-nav next" type="button">&gt;</button>
        </div>
    </div>
    <div class="item">
        <div class="text-container">
            <span class="title product">PRODUCT</span>
            <span class="description">해당 카테고리의 인기 많은 제품</span>
        </div>
        <div class="slider-container">
            <button class="slider-nav prev" type="button">&lt;</button>
            <ul class="grid">
                <!-- [수정] 상품이 없을 경우 메시지 표시 -->
                <li class="box empty-message" th:if="${popularItems == null || #arrays.isEmpty(popularItems)}">
                    <div class="info">
                        <span class="nonTitle">추천할 상품이 없습니다.</span>
                    </div>
                </li>
                <li class="box" th:each="item : ${popularItems}" th:unless="${popularItems == null || #arrays.isEmpty(popularItems)}">
                    <a th:href="@{'/item/?id=' + ${item.id}}">
                        <img th:src="${item.imagePath != null && (item.imagePath.startsWith('http') || item.imagePath.startsWith('/')) ? item.imagePath : '/images/' + item.imagePath}" alt="상품 이미지" class="image">
                    </a>
                    <div class="info">
                        <span class="title" th:text="${item.itemName}">상품명</span>
                        <div class="subtitle">
                            <span class="icon" th:text="${#numbers.formatInteger(item.price, 0, 'COMMA') + '원'}">가격</span>
                            <span class="icon" th:text="'★ ' + ${#numbers.formatDecimal(item.rating, 1, 1)} + ' (' + ${item.reviewCount} + ')'">별점</span>
                        </div>
                    </div>
                </li>
            </ul>
            <button class="slider-nav next" type="button">&gt;</button>
        </div>
    </div>
    <div class="item">
        <div class="text-container">
            <span class="title all">ALL PRODUCT</span>
            <span class="description">해당 카테고리의 모든 제품</span>
        </div>
        <div class="slider-container">
            <button class="slider-nav prev" type="button">&lt;</button>
            <ul class="grid">
                <!-- [수정] 상품이 없을 경우 메시지 표시 -->
                <li class="box empty-message" th:if="${allItems == null || #arrays.isEmpty(allItems)}">
                    <div class="info">
                        <span class="nonTitle">등록된 상품이 없습니다.</span>
                    </div>
                </li>
                <li class="box" th:each="item : ${allItems}" th:unless="${allItems == null || #arrays.isEmpty(allItems)}">
                    <a th:href="@{'/item/?id=' + ${item.id}}">
                        <img th:src="${item.imagePath != null && (item.imagePath.startsWith('http') || item.imagePath.startsWith('/')) ? item.imagePath : '/images/' + item.imagePath}" alt="상품 이미지" class="image">
                    </a>
                    <div class="info">
                        <span class="title" th:text="${item.itemName}">상품명</span>
                        <div class="subtitle">
                            <span class="icon" th:text="${#numbers.formatInteger(item.price, 0, 'COMMA') + '원'}">가격</span>
                            <span class="icon" th:text="'★ ' + ${#numbers.formatDecimal(item.rating, 1, 1)} + ' (' + ${item.reviewCount} + ')'">별점</span>
                        </div>
                    </div>
                </li>
            </ul>
            <button class="slider-nav next" type="button">&gt;</button>
        </div>
    </div>

</div>
</body>
</html>
