<!DOCTYPE html>
<html lang="ko"  xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width = device-width, initial-scale = 1">
    <title>Register</title>
    <link rel="stylesheet" href="/assets/styles/common.css">
    <link rel="stylesheet" href="/assets/styles/register/index.css">
    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <script defer src="/assets/scripts/common.js"></script>
    <script defer src="/assets/scripts/register/address.js"></script>
    <script defer src="/assets/scripts/register/register.js"></script>

    <link href="/assets/images/login/favicon.png" rel="icon"  ></head>
<body>

<div id="dialog">
    <a class="close" href="#">
        <img alt="X" class="image" src="/assets/images/register/close.png">
    </a>
    <div class="modal"></div>
</div>
<section class="register-form">
    <h2>회원가입</h2>

    <div class="user-type">
        <input type="radio" id="customer" name="usertype" value="customer" checked>
        <label for="customer" class="tab active">CUSTOMER</label>

        <input type="radio" id="owner" name="usertype" value="owner" >
        <label for="owner" class="tab">OWNER</label>
    </div>
    <input type="hidden" id="globalSocialId" th:value="${socialId}">
    <input type="hidden" id="globalSocialTypeCode" th:value="${socialTypeCode}">
    <form novalidate id="customerForm" class="signup-form" autocomplete="off">

        <div class="int-area">
            <input type="email" id="email" name="email" required placeholder="" minlength="5" maxlength="50">
            <label for="email">이메일</label>
            <input hidden name="salt" type="hidden">
            <button type="button" name="emailSendButton">인증하기</button>
        </div>
        <div class="int-area">
            <input type="text" id="code" name="code" required placeholder="" minlength="6" maxlength="6" disabled>
            <label for="code">이메일 인증번호</label>
            <button type="button" name="verifyButton" disabled>확인하기</button>
        </div>
        <div class="int-area">
            <input type="text" id="name" name="name" required placeholder="" minlength="2" maxlength="10">
            <label for="name">이름</label>
        </div>

        <div class="int-area">
            <input type="password" id="password" name="password" placeholder="" required minlength="6" maxlength="20"> <label for="password">비밀번호 (6자 이상)</label>
        </div>

        <div class="int-area">
            <input type="password" id="confirm" name="confirm" maxlength="20" minlength="6" required placeholder="">
            <label for="confirm">비밀번호 확인</label>
        </div>
<!--        <label class="group-label">휴대폰 번호</label>
        <div class="phone-input">
        &lt;!&ndash;    <input type="text" maxlength="3" name="">
            <input type="text" maxlength="4">
            <input type="text" maxlength="4">&ndash;&gt;
            <select required class="contact-first" name="contactFirst" >
                <option selected value="010">010</option>
            </select>
            <input required autocomplete="off" class="contact-second" maxlength="4" minlength="3" name="contactSecond" placeholder="0000" spellcheck="false" type="text" >
            <input required autocomplete="off" class="contact-third" maxlength="4" minlength="4" name="contactThird" placeholder="0000" spellcheck="false" type="text">
        </div>-->

        <!--<div class="int-area">
            <input type="tel" id="phone" name="phone" maxlength="11" minlength="11" required placeholder="">
            <label for="phone">전화 번호</label>
        </div>-->
        <label class="group-label">전화 번호</label>
        <div class="phone-input">
            <input type="text" id="custPhone1" name="phone1" maxlength="3" class="phone-part" required>
            <span class="dash">-</span>
            <input type="text" id="custPhone2" name="phone2" maxlength="4" class="phone-part" required>
            <span class="dash">-</span>
            <input type="text" id="custPhone3" name="phone3" maxlength="4" class="phone-part" required>
        </div>
        <div class="style-hashtag-area">
            <label>스타일(선호)</label>
            <div class="selected-tags empty" id="selectedTags"></div>
            <input type="hidden" name="style" id="styleInput">

            <div class="hashtag-options">
                <button type="button" class="hashtag-btn" data-style="스트릿">#스트릿</button>
                <button type="button" class="hashtag-btn" data-style="미니멀">#미니멀</button>
                <button type="button" class="hashtag-btn" data-style="댄디">#댄디</button>
                <button type="button" class="hashtag-btn" data-style="캐주얼">#캐주얼</button>
                <button type="button" class="hashtag-btn" data-style="빈티지">#빈티지</button>
                <button type="button" class="hashtag-btn" data-style="모던">#모던</button>
                <button type="button" class="hashtag-btn" data-style="스포티">#스포티</button>
                <button type="button" class="hashtag-btn" data-style="페미닌">#페미닌</button>
            </div>
            <div class="helper-text">최대 2개까지 선택할 수 있습니다</div>
        </div>
        <div class="int-area">
            <input type="text" id="address_customer" name="address" required placeholder="">
            <label for="address_customer">주소</label>
            <button id="customer-button" type="button">입력하기</button>
        </div>
        <div class="int-area">
            <input type="text" id="address_customer_detail" name="addressDetail" required placeholder="">
            <label for="address_customer">상세주소</label>
        </div>

        <label class="group-label">성별</label>
        <div class="gender">
            <label><input required type="radio" name="gender" value="M"> 남자</label>
            <label><input required type="radio" name="gender" value="F"> 여자</label>
        </div>

        <div class="checkboxes">
            <label><input type="checkbox" required> (필수) 약관 및 개인정보 이용 동의</label>
            <label><input type="checkbox" required> (필수) 만 14세 이상입니다</label>
        </div>

        <div class="btn-area">
            <button type="submit">가입하기</button>
        </div>
        <a class="login" href="/login" >로그인</a>
    </form>

    <form novalidate id="ownerForm" class="signup-form hidden" autocomplete="off">
        <div class="int-area">
            <input type="email" id="email2" name="email" required placeholder="">
            <label for="email2">이메일</label>
            <input hidden name="salt" type="hidden">
            <button type="button" name="emailSendButton">인증하기</button>
        </div>
        <div class="int-area">
            <input type="text" id="code2" name="code" required placeholder="" minlength="6" maxlength="6" disabled>
            <label for="code2">이메일 인증번호</label>
            <button type="button" name="verifyButton" disabled>확인하기</button>
        </div>
        <div class="int-area">
            <input type="text" id="name2" name="name" required placeholder="">
            <label for="name2">이름</label>
        </div>

        <div class="int-area">
            <input type="text" id="storeName" name="storeName" required placeholder="">
            <label for="storeName">가게 이름</label>
        </div>

        <div class="int-area">
            <input type="text" id="businessNum" name="businessNum" placeholder="" required> <label for="businessNum">사업자등록번호 (예: 123-45-67890)</label>
        </div>

        <div class="int-area">
            <input type="password" id="password2" name="password" placeholder="" required minlength="6"> <label for="password2">비밀번호 (6자 이상)</label>
        </div>

        <div class="int-area">
            <input type="password" id="confirm2" name="confirm" required placeholder="">
            <label for="confirm2">비밀번호 확인</label>
        </div>

        <label class="group-label">전화 번호</label>
        <div class="phone-input">
            <input type="text" id="ownerPhone1" name="phone1" maxlength="3" class="phone-part" required>
            <span class="dash">-</span>
            <input type="text" id="ownerPhone2" name="phone2" maxlength="4" class="phone-part" required>
            <span class="dash">-</span>
            <input type="text" id="ownerPhone3" name="phone3" maxlength="4" class="phone-part" required>
        </div>
        <div class="int-area">
            <input type="text" id="address_owner" name="address" required placeholder="">
            <label for="address_owner">사업장 주소</label>
            <button id="owner-button" type="button">입력하기</button>
        </div>
        <div class="int-area">
            <input type="text" id="address_owner_detail" name="addressDetail" required placeholder="">
            <label for="address_owner">상세 주소</label>
        </div>

     <!--   <div class="imageSelect">
            <input type="file" class="image" id="image">
            <label for="image" class="button-label">매장사진을 첨부해주세요.</label>
        </div>
-->        <div class="checkboxes">
            <label><input type="checkbox" required> (필수) 약관 및 개인정보 이용 동의</label>
            <label><input type="checkbox" required> (필수) 만 14세 이상입니다</label>
        </div>

        <div class="btn-area">
            <button type="submit">가입하기</button>
        </div>
        <a class="login" href="/login">로그인</a>
    </form>

</section>

<script>

</script>
</body>
</html>
