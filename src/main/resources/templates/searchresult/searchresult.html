<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>검색 결과</title>
    <link href="/assets/styles/common.css" rel="stylesheet" type="text/css">
    <link href="/assets/styles/searchresult/index.css" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,100..900;1,100..900&family=Gowun+Dodum&family=Nanum+Brush+Script&display=swap" rel="stylesheet">
    <link href="/assets/images/login/favicon.png" rel="icon">
    <script defer src="/assets/scripts/common.js" type="text/javascript"></script>
    <script defer src="/assets/scripts/searchresult/index.js" type="text/javascript"></script>
</head>
<body>
<th:block th:replace="~{fragments/common.html :: customer-header}"></th:block>
<th:block th:replace="~{fragments/common.html :: customer-mobile-header}"></th:block>
<th:block th:replace="~{fragments/common.html :: customer-mobile-footer}"></th:block>

<main id="main">
    <div class="banner-wrapper">
        <img src="/assets/images/main/splash1.jpg" class="image" alt="배너 이미지">
    </div>

    <div class="container">
        <form class="search-form box" method="get" action="/search-result" id="searchForm">
            <label class="label">
                <svg class="icon box" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24px" height="24px">
                    <path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
                <input autofocus required class="input" maxlength="50" minlength="1" name="keyword" type="search" autocomplete="off" th:value="${keyword}" placeholder="검색어를 입력하세요" id="keywordInput">
            </label>
        </form>

        <!-- 상품 검색 결과 -->
        <div class="section-title" th:if="${searchResults != null and searchResults.length > 0}">상품 검색 결과</div>
        <div class="grid box" th:if="${searchResults != null and searchResults.length > 0}">
            <a th:each="item : ${searchResults}" th:href="@{'/item/?id=' + ${item.id}}" class="item-card">
                <div class="image-wrapper">
                    <img th:if="${item.imagePath != null}" th:src="@{'/images/' + ${item.imagePath}}" alt="상품 이미지">
                    <img th:unless="${item.imagePath != null}" src="/assets/images/item/front.png" alt="기본 이미지">
                </div>
                <div class="text-wrapper">
                    <span class="shop-name" th:text="${item.shopName}">매장명</span>
                    <span class="title" th:text="${item.itemName}">상품명</span>
                    <span class="price" th:text="${#numbers.formatInteger(item.price, 0, 'COMMA') + '원'}">가격</span>
                </div>
            </a>
        </div>

        <!-- 매장 검색 결과 -->
        <div class="section-title shop-title" th:if="${shopResults != null and shopResults.length > 0}">매장 검색 결과</div>
        <div class="grid box" th:if="${shopResults != null and shopResults.length > 0}">
            <a th:each="shop : ${shopResults}" th:href="@{'/shop/?shopId=' + ${shop.shopId}}" class="item-card shop-card">
                <div class="image-wrapper">
                    <!-- 매장 이미지가 있으면 표시, 없으면 기본 이미지 -->
                    <img th:if="${shop.profileImage != null}" th:src="${shop.profileImage}" alt="매장 이미지">
                    <img th:unless="${shop.profileImage != null}" src="/assets/images/shop/default.png" alt="기본 매장 이미지">
                </div>
                <div class="text-wrapper">
                    <span class="title" th:text="${shop.shopName}">매장명</span>
                    <span class="shop-desc" th:text="${shop.shopCategory}" style="font-size: 13px; color: #666; margin-top: 5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">매장 카테고리</span>
                    <span class="shop-addr" th:text="${shop.shopAddress}" style="font-size: 12px; color: #888; margin-top: auto;">주소</span>
                </div>
            </a>
        </div>

        <!-- 검색 결과 없음 -->
        <div th:if="${(searchResults == null or searchResults.length == 0) and (shopResults == null or shopResults.length == 0) and keyword != null and keyword != ''}" class="no-result">
            '<span th:text="${keyword}" class="highlight"></span>'에 대한 검색 결과가 없습니다.
        </div>

        <div th:if="${keyword == null or keyword == ''}" class="no-result">
            키워드를 통해 검색해주세요.
        </div>
    </div>
</main>
</body>
</html>
