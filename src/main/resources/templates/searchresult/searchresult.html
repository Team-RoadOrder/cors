<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Search Result</title>
    <link rel="stylesheet" href="/assets/styles/searchresult/index.css">
    <link rel="stylesheet" href="/assets/styles/common.css">
    <link href="/assets/images/login/favicon.png" rel="icon">
    <link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,100..900;1,100..900&family=Gowun+Dodum&family=Nanum+Brush+Script&display=swap" rel="stylesheet">
    <script defer src="/assets/scripts/common.js"></script>
</head>
<body>
<!-- 헤더부분 , 로고와 네비바가 들어감 -->
<th:block th:replace="~{/fragments/common.html :: customer-header}">
</th:block>
<main id="main" >
    <img src="../assets/images/my/waviness.png" class="image" alt="" >
</main>
<!-- 헤더뒤에 배경 -->
<form class="search-form box" method="get" action="/search-result">
    <label class="label" >
        <svg class="icon box" xmlns="http://www.w3.org/2000/svg" width="800px" height="800px" viewBox="0 0 32 32" version="1.1">
        </svg>
        <input autofocus required class="input" maxlength="50" minlength="1"
               name="keyword" type="search" autocomplete="off"
               th:value="${keyword}"> </label>
</form >

<div class="grid box">
    <a th:each="item : ${searchResults}"
       th:href="@{'/item/?id=' + ${item.id}}"
       th:if="${searchResults != null and searchResults.length > 0}">

        <div class="image-wrapper">
            <img th:src="@{'/images/' + ${item.imagePath}}"
                 th:if="${item.imagePath != null}" alt="상품 이미지">
            <img src="/assets/images/item/front.png"
                 th:unless="${item.imagePath != null}" alt="기본 이미지">
        </div>
        <div class="text-wrapper">
            <span class="title" th:text="${item.itemName}">상품명</span>
            <span class="price" th:text="${#numbers.formatInteger(item.price, 0, 'COMMA') + '원'}">가격</span>
        </div>
    </a>

    <div th:if="${searchResults == null or searchResults.length == 0}"
         style="grid-column: 1 / -1; text-align: center; padding: 50px; font-size: 1.2rem; color: #666;">
        '<span th:text="${keyword}" style="font-weight: bold;"></span>'에 대한 검색 결과가 없습니다.
    </div>
</div>

<script>
    document.addEventListener('scroll', function() {
        const header = document.getElementById('header');
        if (window.scrollY > 0) {
            header.classList.add('scroll-active');
        } else {
            header.classList.remove('scroll-active');
        }
    });
    // 검색창에 있는 헤더를 위한
    const searchIcon = document.querySelector('.glass');
    const searchInput = document.getElementById('searchInput');

    // 돋보기 아이콘에 'click' 이벤트 리스너를 추가합니다.
    if (searchIcon) {
        searchIcon.addEventListener('click', (event) => {
            // a 태그의 기본 동작(페이지 이동 등)을 막습니다.
            event.preventDefault();

            // searchInput 요소에 'show' 클래스를 추가하거나 제거합니다 (toggle).
            searchInput.classList.toggle('show');

            // 만약 검색창이 보이는 상태가 되었다면, 바로 입력할 수 있도록 focus를 줍니다.
            if (searchInput.classList.contains('show')) {
                searchInput.focus();
            }
        });
    }
</script>

</body>
</html>
