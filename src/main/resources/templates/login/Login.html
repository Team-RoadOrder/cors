<!DOCTYPE html>
<html lang = "ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width = device-width, initial-scale = 1">
    <title>Login Page</title>
    <link rel="stylesheet" type="text/css" href="/assets/styles/login/style.css">
    <link rel="stylesheet" type="text/css" href="/assets/styles/common.css">
    <script defer src="/assets/scripts/common.js"></script>
    <script defer src="/assets/scripts/login/login.js"></script>
    <link href="/assets/images/login/favicon.png" rel="icon" >

</head>
<body>

<section class="login-form" >
    <a href="/login" class="box" id="logo">
        <div>
        <img src="/assets/images/main/img.png" alt="" class="site-logo">
        </div>
    </a>
    <form id="loginForm" autocomplete="off">
        <!--<div class="int-area">
            <input type="text" name="id" id="id" required>
            <label for="id">아이디</label>
        </div>-->
        <div class="int-area">
            <input type="text" name="email" id="email" required>
            <label for="email">이메일</label>
        </div>
        <div class="int-area">
            <input type="password" name="password" id="password" required>
            <label for="password">비밀번호</label>
        </div>
        <div class="btn-area">
            <button type="submit" id="btn">로그인</button>
        </div>
    </form>
    <div class="container">
    <span class="caption">
        <a href="/register"> 회원가입 </a>
    </span>

    <span class="caption">
        <a href="/findpw"> 비밀번호 찾기</a>
    </span>
    <div class="caption sns">
        <a href="">
        <img src="/assets/images/login/kakao.png" alt="">
        </a>
        <a href="">
        <img src="/assets/images/login/naver.png" alt="">
        </a>
    </div>
    </div>
</section>


</body>
</html>
