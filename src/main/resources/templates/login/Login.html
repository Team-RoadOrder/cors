<!DOCTYPE html>
<html lang = "ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width = device-width, initial-scale = 1">
    <title>Login Page</title>
    <link rel="stylesheet" type="text/css" href="/assets/styles/login/style.css">
    <link href="/assets/images/login/favicon.png" rel="icon" >
</head>
<body>
<section class="login-form" >
    <a href="/" class="box" id="logo">
        <div>
        <img src="/assets/images/main/img.png" alt="" class="site-logo">
        </div>
    </a>
    <form id="loginForm" autocomplete="off">
        <div class="int-area">
            <input type="text" name="id" id="id" required>
            <label for="id">아이디</label>
        </div>
        <div class="int-area">
            <input type="password" name="password" id="password" required>
            <label for="password">비밀번호</label>
        </div>
        <div class="btn-area">
            <button type="submit" id="btn">로그인</button>
        </div>
    </form>
    <div class="caption">
        <a href="/register"> 회원가입 </a>
    </div>

    <div class="caption">
        <a href="../FINDPW/findpw.html"> 비밀번호 찾기</a>
    </div>

</section>


</body>
</html>
